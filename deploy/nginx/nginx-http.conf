# HTTP-only nginx (no TLS): convenient for local testing without certificates.
# Build the web image with --build-arg NGINX_CONF=nginx-http.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(chat|chat/stream|upload|knowledge|sessions|files|workspace|models|memory|executions|agents|tools|health|metrics|docs|redoc|openapi\.json) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /outputs/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
}
