# Production nginx: static SPA + reverse proxy to the API container.
# TLS certificates are mounted at /etc/nginx/certs/{fullchain,privkey}.pem
# (see deploy/nginx/certs/README.md for obtaining them).

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + streaming paths -> backend container
    location ~ ^/(chat|chat/stream|upload|knowledge|sessions|files|workspace|models|memory|executions|agents|tools|health|metrics|docs|redoc|openapi\.json) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: keep the stream open, no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Generated files (agent outputs) are fetched from the backend API.
    location /outputs/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
}
