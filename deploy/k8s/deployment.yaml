apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow
  labels:
    app: agentflow
spec:
  # SQLite + a ReadWriteOnce PVC means a single writable replica. Scale out
  # only after moving to a shared database (e.g. Postgres) and RWX storage.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: agentflow
  template:
    metadata:
      labels:
        app: agentflow
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: agentflow
        image: agentflow:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agentflow-config
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentflow-secrets
              key: deepseek_api_key
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: data
        - name: data
          mountPath: /app/agentflow/database
          subPath: database
        - name: data
          mountPath: /app/knowledge_files
          subPath: knowledge_files
        - name: data
          mountPath: /app/uploads
          subPath: uploads
        - name: data
          mountPath: /app/logs
          subPath: logs
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agentflow-data
