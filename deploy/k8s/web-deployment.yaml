apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow-web
  labels:
    app: agentflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentflow-web
  template:
    metadata:
      labels:
        app: agentflow-web
    spec:
      containers:
      - name: web
        image: omniforge-web:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-conf
        configMap:
          name: agentflow-web-nginx
