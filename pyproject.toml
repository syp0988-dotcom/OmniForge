[project]
name = "omniforge"
version = "0.1.0"
description = "A modular multi-agent platform built with FastAPI, LangGraph, and Python tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "langgraph>=0.2.0",
  "openai>=1.35.0",
  "jinja2>=3.1.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.24.0",
  "pypdf>=4.0.0",
  "python-docx>=1.0.0",
  "beautifulsoup4>=4.12.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.0",
  "lxml>=5.0.0",
  "ebooklib>=0.18",
  "langchain-text-splitters>=0.0.2",
  "qdrant-client>=1.9.0",
  "jieba>=0.42.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"agentflow/**/__init__.py" = ["F401"]
